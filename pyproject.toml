[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaflow"
version = "0.1.0"
description = "Local-first Windows desktop media download manager"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.11.2", "yt-dlp==2026.8.19"]

[project.scripts]
mediaflow = "mediaflow.presentation.entrypoint:main"

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-socket==0.8.1",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --disable-socket -m 'not smoke'"
markers = ["smoke: opt-in checks using external network or executables"]
