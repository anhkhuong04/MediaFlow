name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked --extra dev
      - name: Format
        run: .\.venv\Scripts\python -m ruff format --check .
      - name: Lint
        run: .\.venv\Scripts\python -m ruff check .
      - name: Types
        run: .\.venv\Scripts\python -m mypy
      - name: Offline unit and integration tests
        run: .\.venv\Scripts\python -m pytest
      - name: Dependency consistency
        run: uv pip check
